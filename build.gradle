buildscript {
	repositories {
		mavenCentral()
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.sentry.jvm.gradle' version '6.14.0'
	id 'org.gradle.test-retry' version '1.6.5'
}

group = 'com.growingpots'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 소스 코드를 Sentry에 업로드해 스택트레이스에서 실제 코드 라인을 볼 수 있게 함(CI에서만 authToken 주입).
sentry {
	includeSourceContext = true
	org = "growingpots"
	projectName = "java-spring-boot"
	authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()

	// PlannerSaveTest의 동시성 테스트(CountDownLatch로 실제 스레드 2개를 띄워 락 직렬화를 검증)는
	// 실제 OS 스레드 스케줄링에 의존한다. 로컬(코어 다수)에서는 전혀 안 흔들리는데 GitHub Actions
	// 러너(코어 적음)에서만 간헐적으로 실패하는 게 반복 확인됐다 - 락/격리수준 설계 자체는 로컬에서
	// 같은 커밋으로 반복 실행(단독/풀스위트 각 15회 이상) 전부 통과해 문제없음을 확인했다.
	// 이런 타이밍 의존 테스트의 근본적인 한계라 재시도로 흡수한다 - 실패해도 1번 더 돌려서 통과하면
	// 정상 처리, maxRetries를 다 써도 실패하면(=진짜 회귀) 여전히 빌드가 깨진다.
	retry {
		maxRetries = 2
		maxFailures = 5
		filter {
			includeClasses.add("com.growingpots.domain.planner.controller.PlannerSaveTest")
		}
	}
}
