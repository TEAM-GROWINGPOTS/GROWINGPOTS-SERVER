server:
  port: 18081

# actuator(헬스체크, 지표)는 서버 안에서만 접근하는 관리 포트로 분리한다(#295). prod(8090)와 같은 서버라 포트를 다르게 둔다.
management:
  server:
    port: 18091
    address: 127.0.0.1

spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

jwt:
  secret: ${DEV_JWT_SECRET}
  expiration: 1800000
  refresh-expiration: 1209600000

app:
  base-url: https://growing-pots.p-e.kr:8081

cors:
  allowed-origins: https://dev.growingpots.kr,https://www.growingpots.kr,https://growingpots.kr,http://localhost:3000

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}

logging:
  level:
    com.growingpots: debug
