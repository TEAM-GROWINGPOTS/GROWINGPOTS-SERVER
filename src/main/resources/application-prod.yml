# actuator(헬스체크, 지표)는 서버 안에서만 접근하는 관리 포트로 분리한다(#295). dev(18091)와 같은 서버라 포트를 다르게 둔다.
management:
  server:
    port: 8090
    address: 127.0.0.1

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000
  refresh-expiration: 1209600000

app:
  base-url: https://growing-pots.p-e.kr

cors:
  allowed-origins: https://www.growingpots.kr,https://growingpots.kr,https://dev.growingpots.kr

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}

logging:
  level:
    com.growingpots: info

# prod에선 API 목록이 외부에 보이지 않게 Swagger와 API 문서를 끈다(#295). 프론트 협업용 dev는 유지한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
