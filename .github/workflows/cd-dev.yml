name: Dev CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew clean build

      - name: Prepare executable jar
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "Executable jar not found."
            exit 1
          fi
          cp "$JAR_PATH" app.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote app directory exists
        run: |
          ssh -i ~/.ssh/ec2_key -p "${{ secrets.EC2_PORT }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p /home/${{ secrets.EC2_USER }}/app-dev"

      - name: Upload jar to EC2
        run: |
          scp -i ~/.ssh/ec2_key -P "${{ secrets.EC2_PORT }}" app.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app-dev/app.jar"

      - name: Restart application
        run: |
          ssh -i ~/.ssh/ec2_key -p "${{ secrets.EC2_PORT }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -e
          APP_DIR="/home/${USER}/app-dev"
          APP_JAR="${APP_DIR}/app.jar"

          # 앱은 systemd 서비스(growingpots-dev)로 돈다. 죽으면 자동 재시작하고 Discord로 알린다(#292).
          # 환경 변수는 서비스가 읽는 파일로 넘긴다. 본인만 읽을 수 있게 600
          umask 077
          cat > "${APP_DIR}/dev.env" << 'ENV'
          DEV_DB_URL='${{ secrets.DEV_DB_URL }}'
          DB_USERNAME='${{ secrets.DB_USERNAME }}'
          DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
          DEV_JWT_SECRET='${{ secrets.DEV_JWT_SECRET }}'
          DISCORD_WEBHOOK_URL='${{ secrets.DISCORD_WEBHOOK_URL }}'
          SENTRY_DSN='${{ secrets.SENTRY_DSN }}'
          ENV

          # systemd 전환 전 nohup으로 띄운 앱이 남아 있으면 끄고, 포트가 풀릴 때까지 기다린다 (전환 후 첫 배포에서만 해당)
          if pkill -f "^java -jar ${APP_JAR}"; then
            for i in $(seq 1 30); do
              pgrep -f "^java -jar ${APP_JAR}" > /dev/null || break
              sleep 1
            done
          fi

          sudo systemctl restart growingpots-dev

          for i in $(seq 1 30); do
            # actuator는 127.0.0.1에만 열린 관리 포트(18091)에 있다(#295)
            if curl -sf http://127.0.0.1:18091/actuator/health > /dev/null 2>&1; then
              echo "Application started successfully"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Application failed to start. Recent logs:"
              sudo journalctl -u growingpots-dev -n 50 --no-pager || true
              exit 1
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done
          EOF

      - name: 배포 성공 알림
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "✅ Dev 배포 성공",
              "description": "`${{ github.ref_name }}` 브랜치가 dev 서버(8081)에 배포됐어요.",
              "color": 5763719,
              "fields": [
                {"name": "커밋", "value": "${{ github.sha }}", "inline": true},
                {"name": "작업자", "value": "${{ github.actor }}", "inline": true}
              ]
            }]
          }' || true

      - name: 배포 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "❌ Dev 배포 실패",
              "description": "Actions를 확인해주세요.",
              "color": 15548997,
              "fields": [
                {"name": "작업자", "value": "${{ github.actor }}", "inline": true},
                {"name": "링크", "value": "https://github.com/${{ github.repository }}/actions", "inline": true}
              ]
            }]
          }' || true
